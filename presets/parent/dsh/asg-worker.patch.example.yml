# dsh profile patch layer: give the parent agent the spawn_worker tool (disposable Firecracker worker via ASG).
# Copy into your profile's patch file (e.g. $DSH_HOME/profiles/<profile>/<name>.patch.yml) or pass with --patch.
# Placeholders: <PYTHON>, <SPAWN_WORKER_DIR>, <MODEL_BASE_URL>, <MODEL_KEY_ENV>, <MODEL_ID>.
# Secrets: only the NAME of the env var holding the parent's model key appears here; spawn_worker refuses to start a
# worker if that key value would appear in the worker spec (provider_key_env in spawn_worker.json).

# (optional) parent model provider - any OpenAI-compatible endpoint
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      local-llm:
        api: openai-completions
        baseURL: <MODEL_BASE_URL>          # e.g. http://localhost:9200/v1
        apiKeyEnv: <MODEL_KEY_ENV>         # env var NAME, never the value
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        models:
          - id: <MODEL_ID>
            name: <MODEL_ID>
            contextWindow: 131072
            maxTokens: 8192
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: local-llm
    model: <MODEL_ID>

# spawn_worker MCP server (stdio). The tool schema is fixed (task, urls, allowed_hosts, probe_lan); operator-only
# arguments (test_mode, read_mode, decoy_file, limits) are rejected when they come from the model.
- insert:
    - id: mcp-asg-worker
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: asg-worker
        transport: stdio
        command: <PYTHON>                   # e.g. C:/Program Files/Python312/python.exe or /usr/bin/python3
        args:
          - <SPAWN_WORKER_DIR>/spawn_worker.py
          - mcp
        cwd: <SPAWN_WORKER_DIR>
        toolCallTimeoutMs: 2460000          # > spawn_worker ssh timeout (2400 s); long generations take minutes
        failOnStartupError: false
